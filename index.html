<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Zynimous Sandbox</title>
<meta name="description" content="Zynimous：匿名軟體工程師的作戰沙盤式個人網站。">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@500;700;800&family=JetBrains+Mono:wght@400;500&family=Prompt:wght@400;500;600&family=Noto+Sans+TC:wght@400;500;700&display=swap" rel="stylesheet">

</head>
<body>
<canvas id="scene" tabindex="0" aria-label="作戰沙盒地圖：WASD 或拖曳移動，滾輪縮放"></canvas>
<div id="reticle"></div>
<div id="labels"></div>
<div class="train" id="train" aria-hidden="true"><div class="t-top"></div><div class="t-bot"></div></div>
<button id="edge-arrow" type="button" hidden></button>

<div class="hud" id="hud-tl">
  <div class="logo" id="logo">ZYNIMOUS</div>
  <div class="sublogo">OPERATIONAL MAP // SANDBOX v0.2</div>
  <nav class="crumbs" id="crumbs" aria-label="目前位置"></nav>
</div>

<dl class="hud" id="hud-tr">
  <dt>TGT</dt><dd id="r-tgt">E 0000 · N 0000</dd>
  <dt>CUR</dt><dd id="r-cur">—</dd>
  <dt>ELEV</dt><dd id="r-elev">—</dd>
  <dt>ALT</dt><dd id="r-alt">—</dd>
  <dt>TPE</dt><dd id="r-time">--:--:--</dd>
</dl>

<nav class="hud" id="hud-left" aria-label="區塊">
  <div class="sec-h">REGIONS</div>
</nav>

<div class="hud" id="hud-br">
  <div class="cap"><span>OVERVIEW</span><span>N ↑</span></div>
  <canvas id="mini" width="176" height="176" aria-label="小地圖，點擊跳轉"></canvas>
</div>

<div class="hud" id="hud-bl">
  <div class="btns">
    <button class="btn" id="b-tour" type="button"><kbd>T</kbd>自動巡航</button>
    <button class="btn" id="b-pal" type="button"><kbd>Ctrl K</kbd>指令</button>
    <button class="btn" id="b-world" type="button"><kbd>Esc</kbd>全圖</button>
  </div>
  <div class="hint">WASD / 拖曳 移動 · 滾輪 Q E 縮放 · 1–9 跳轉區域 · ← → 切換內容</div>
  <div class="scale"><i id="scale-bar"></i><span id="scale-txt">500 m</span></div>
</div>

<div class="hud" id="tourchip" hidden><span id="tour-txt">AUTO TOUR 1/4</span><button type="button" id="tour-stop">STOP</button></div>

<div id="scrim"></div>
<aside id="panel" aria-hidden="true" aria-labelledby="p-title">
  <div class="i-head"><span>INTEL · <b id="p-code">FILE</b></span><span class="p-ctl"><button type="button" id="p-prev" aria-label="上一篇">←</button><button type="button" id="p-next" aria-label="下一篇">→</button><button type="button" id="p-close">ESC ✕</button></span></div>
  <div class="i-scroll" id="p-scroll"></div>
  <div class="i-foot"><span>← → 切換內容</span><span>ESC 返回地圖</span></div>
</aside>
<div id="fade"></div>

<div id="palette" hidden>
  <div class="pal" role="dialog" aria-label="指令面板">
    <div class="pal-in"><span>&gt;</span><input id="pal-q" type="text" placeholder="輸入區域、內容或標籤…" autocomplete="off" spellcheck="false"></div>
    <div id="pal-list" role="listbox"></div>
    <div class="pal-foot"><span>↑↓ 選擇</span><span>Enter 前往</span><span>Esc 關閉</span></div>
  </div>
</div>

<div id="boot"><div class="boot-box" id="boot-box">
  <div><span>UPLINK</span><b>ESTABLISHED</b></div>
  <div><span>STRUCTURES</span><b id="boot-verts">—</b></div>
  <div><span>REGIONS</span><b id="boot-sectors">— ONLINE</b></div>
  <div><span>OPERATOR</span><b>ZYNIMOUS</b></div>
</div></div>

<script type="module" src="/src/main.js"></script>

</body>
</html>
